<style>

.primary{width:100%;background:var(--accent2);color:#fff;font-weight:800;font-size:16px;padding:17px;margin:8px 0 12px}.secondary{width:100%;background:var(--panel2);color:var(--text)}

.timerwrap{text-align:center;margin:26px auto 12px}.ring{width:min(72vw,330px);aspect-ratio:1;border-radius:50%;margin:auto;background:conic-gradient(var(--accent) var(--progress,0%),var(--ring) 0);display:grid;place-items:center;box-shadow:0 0 55px rgba(124,92,255,.12)}.ring:before{content:"";grid-area:1/1;width:88%;height:88%;border-radius:50%;background:#0d1019;box-shadow:inset 0 0 35px rgba(0,0,0,.35)}.time{grid-area:1/1;z-index:1;font-variant-numeric:tabular-nums;font-size:48px;font-weight:800;letter-spacing:-.04em}.remaining{grid-area:1/1;z-index:1;margin-top:104px;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.15em}.controls{display:flex;gap:9px;justify-content:center;flex-wrap:wrap;margin:16px 0}.controls button{border:0;border-radius:13px;background:var(--panel2);color:var(--text);padding:12px 16px;cursor:pointer}.controls .main{background:var(--accent2);min-width:120px;font-weight:800}.progressText{text-align:center;color:var(--muted);font-size:13px}.next{margin-top:18px;padding:15px;border-radius:16px;background:rgba(255,255,255,.035);color:#cfd3df}.next b{color:#fff}

.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:16px}.day{background:var(--panel);border:1px solid rgba(255,255,255,.05);padding:14px;border-radius:16px}.day b{font-size:14px}.day small{display:block;color:var(--muted);margin-top:5px;line-height:1.4}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.72);display:none;align-items:flex-end;justify-content:center;padding:15px;z-index:100}.modal.open{display:flex}.sheet{max-width:760px;width:100%;max-height:88vh;overflow:auto;background:#101421;border:1px solid #2a3042;border-radius:24px;padding:22px}.sheet h2{margin:0 0 15px}.close{float:right;border:0;background:var(--panel2);color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}.row{padding:13px 0;border-bottom:1px solid rgba(255,255,255,.06)}.row b{display:block}.row span{display:block;color:var(--muted);font-size:13px;margin-top:4px;line-height:1.45}.theme{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.theme button{width:44px;height:44px;border-radius:14px;border:2px solid transparent;cursor:pointer}.theme button.sel{border-color:#fff}.toggle{display:flex;justify-content:space-between;align-items:center;padding:14px 0}.toggle input{width:46px;height:24px;accent-color:var(--accent)}

<style id="completion-controls-css">
.practice-count{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;}
.practice-settings{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:18px;margin-left:auto;}
.practice-back{width:42px;height:42px;padding:0;display:grid;place-items:center;justify-self:start;}
.practice-back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.practice-back:active,.practice-settings:active{transform:scale(.95);}
.practice-top{align-items:center;}
.done-area{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;gap:7px;margin:12px auto 14px;}
.done-button{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,280px);min-height:52px;padding:0 18px;border:1px solid rgba(255,255,255,.12);border-bottom-color:rgba(0,0,0,.55);border-radius:12px;background:linear-gradient(180deg,#282c35 0%,#1b1e25 48%,#15171d 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.34),0 10px 22px rgba(0,0,0,.24);color:#d9dce4;cursor:pointer;font:800 12px/1 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.13em;text-transform:uppercase;transition:transform .14s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease,color .18s ease;}
.done-button:active{transform:translateY(1px);}
.done-button .led{width:9px;height:9px;border-radius:50%;background:#555b68;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);transition:all .18s ease;}
.done-button .done-check{font-size:16px;line-height:1;color:#777d88;transition:color .18s ease;}
.done-button.is-done{color:var(--theme-accent);border-color:var(--theme-glow);background:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.025) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.35),0 0 0 1px var(--theme-glow),0 0 28px var(--theme-glow);}
.done-button.is-done .led{background:var(--theme-accent);box-shadow:0 0 5px var(--theme-accent),0 0 14px var(--theme-glow);}
.done-button.is-done .done-check{color:var(--theme-accent);}
.day{position:relative;overflow:hidden;transition:transform .16s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease;}
.day.completed{border-color:var(--theme-glow);background:linear-gradient(145deg,var(--theme-bg1),var(--theme-bg2));box-shadow:0 0 24px var(--theme-glow),inset 0 0 0 1px var(--theme-glow);}
.day.completed:after{content:"✓";position:absolute;right:11px;top:9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--theme-accent);background:var(--theme-glow);border:1px solid var(--theme-glow);font-size:13px;font-weight:900;}
.day-status{display:none;margin:16px 0 4px;padding:13px 15px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);color:#dfe1e8;}
.day-status.show{display:flex;align-items:center;gap:10px;}
.day-status .status-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-accent);box-shadow:0 0 10px var(--theme-glow);flex:none;}
.day-status.complete{border-color:var(--theme-glow);background:linear-gradient(135deg,var(--theme-bg1),var(--theme-bg2));}
.day-status.complete .status-dot{background:var(--theme-accent);box-shadow:0 0 12px var(--theme-glow);}
.primary[disabled]{cursor:default;opacity:.78;box-shadow:none !important;}
@media(max-width:480px){.done-button{min-height:34px}}
</style>

<style id="pg-v13">

.keys .k{position:relative;flex:1;min-width:0;border-radius:0 0 7px 7px;background:linear-gradient(180deg,#4a4d5c,#2b2d39);box-shadow:inset -1px 0 0 rgba(0,0,0,.55),0 2px 0 #14151b;transition:background .3s,box-shadow .3s,transform .2s}

.daily-mascot>.pg-mascot-svg{width:auto!important;max-width:100%;height:clamp(118px,19dvh,160px)!important;aspect-ratio:auto!important;margin:0!important}
.daily-mascot .pg-mascot-pair{gap:0}
.daily-mascot .pg-mascot-pair .pg-mascot-svg{width:50%!important;height:auto!important;aspect-ratio:auto!important;max-height:130px}
.daily-mascot .mascot-name{position:absolute;left:50%;bottom:3px;z-index:3;width:max-content;max-width:96%;padding:3px 11px 4px;background:var(--paper-card);border:1.4px solid var(--ink);border-radius:9px 12px 9px 12px;box-shadow:2px 2px 0 var(--paper-line);transform:translateX(-50%) rotate(-3deg);font-size:12px;text-align:center}
.daily-mascot .mascot-name span{display:none}
.daily-mascot:not(.is-celebrating) .mascot-speech{display:none}
/* PRACTICE: companion dock, bottom-right, beside "Up Next" */
#session .pg-foot{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;align-items:end;width:100%}
#session .pg-foot-l{min-width:0;display:flex;flex-direction:column;gap:6px;justify-content:flex-end}
#session .pg-foot-l .progressText{text-align:left;margin:0;padding-left:2px}
#session .pg-foot-l .next{width:100%;margin:0}
#session .pg-foot .practice-mascot,#session .pg-foot .practice-mascot.is-celebrating{--mh:clamp(86px,12.5dvh,120px);position:relative;flex:none;width:calc(var(--mh)*1.16);height:var(--mh);margin:0;display:flex;align-items:flex-end;justify-content:center;gap:0;overflow:visible}
#session .pg-foot .practice-mascot .pg-mascot-svg{width:auto;max-width:100%;height:100%;aspect-ratio:auto;margin:0}
#session .pg-foot .practice-mascot .pg-mascot-pair{display:flex;align-items:flex-end;width:100%;height:100%}
#session .pg-foot .practice-mascot .pg-mascot-pair .pg-mascot-svg{width:50%!important;height:auto!important;max-height:100%}
#session .pg-foot .practice-mascot:before,#session .pg-foot .practice-mascot.is-celebrating:before{display:none}
#session .pg-foot .practice-mascot .mascot-pop{position:absolute;right:calc(100% - 6px);left:auto;top:16%;max-width:none;white-space:nowrap;transform:rotate(-2deg);z-index:4}
#session .pg-foot .practice-mascot .mascot-pop:before{left:auto;right:-6px;top:50%;border:0;border-right:1.5px solid var(--ink);border-top:1.5px solid var(--ink);transform:rotate(45deg)}
#session .pg-foot.cheer .progressText{visibility:hidden}
/* landscape: dial on the left, so the dock just takes the right column's bottom */
/* sight-reading / czerny focus panel replaces the piano progress */
.pg-focus{width:min(100%,440px);margin:2px auto 0;display:grid;gap:7px}
/* WIDE: mascot lives in the free gap between the title and the quote (placed by script) */
#session .practice-mascot.pg-mid,#session .practice-mascot.pg-mid.is-celebrating{position:absolute;z-index:3;flex:none;width:calc(var(--mh)*1.16);height:var(--mh);margin:0;display:flex;align-items:flex-end;justify-content:center;gap:0;overflow:visible;pointer-events:none}
#session .practice-mascot.pg-mid .pg-mascot-svg{width:auto;max-width:100%;height:100%;aspect-ratio:auto;margin:0}
#session .practice-mascot.pg-mid .pg-mascot-pair{display:flex;align-items:flex-end;width:100%;height:100%}
#session .practice-mascot.pg-mid .pg-mascot-pair .pg-mascot-svg{width:50%!important;height:auto!important;max-height:100%}
#session .practice-mascot.pg-mid:before,#session .practice-mascot.pg-mid.is-celebrating:before{display:none}
#session .practice-mascot.pg-mid .mascot-pop{position:absolute;left:calc(100% - 4px);right:auto;top:10%;max-width:none;white-space:nowrap;transform:rotate(2deg);font-size:13px;padding:7px 13px}
#session .practice-mascot.pg-mid .mascot-pop:before{left:-7px;right:auto;top:50%;border:0;border-left:1.5px solid var(--ink);border-bottom:1.5px solid var(--ink);transform:rotate(45deg)}
.pg-focus[hidden]{display:none}
.pg-steps{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}
.pg-step{position:relative;text-align:left;min-height:46px;padding:7px 7px 7px 27px;border:1.4px solid var(--paper-line);border-radius:12px 14px 11px 13px;background:var(--paper-card);color:var(--soft-ink);font:600 10px/1.25 system-ui,sans-serif;box-shadow:2px 2px 0 rgba(115,80,75,.07);cursor:pointer;transition:transform .12s,background .2s}
.pg-step b{display:block;margin-bottom:1px;font:700 12.5px/1.1 var(--serif);color:var(--ink)}
.pg-step i{position:absolute;left:7px;top:8px;width:15px;height:15px;display:grid;place-items:center;border:1.5px solid var(--paper-line);border-radius:50%;font-style:normal;font-size:9px;color:transparent;transition:.15s}
.pg-step.on{background:var(--theme-bg1);border-color:var(--theme-accent)}
.pg-step.on i{background:var(--theme-accent);border-color:var(--theme-accent);color:#fff}
.pg-step:active{transform:scale(.97)}
.pg-fields{display:flex;gap:7px}
.pg-fields input{flex:1;min-width:0;padding:9px 10px;border:1.4px dashed var(--paper-line);border-radius:10px;background:var(--paper-card);color:var(--ink);font:600 12px system-ui,sans-serif}
.pg-fields input.t{flex:0 0 76px;text-align:center}
.pg-fields input:focus{outline:0;border-style:solid;border-color:var(--theme-accent)}
.pg-last{text-align:center;font:12px var(--hand);color:var(--soft-ink)}

function completionStore(){
  try{return JSON.parse(localStorage.getItem("pianoGrindCompletions")||"{}")}catch(e){return {}}
}
function completionDateKey(){
  const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
}
function completionScope(){return isRedo ? activeDay+"__redo" : activeDay;}
function getCompleted(){
  const all=completionStore(), day=all[completionDateKey()]||{},saved=Array.isArray(day[completionScope()])?day[completionScope()]:[];
  const limit=(routines[activeDay]||[]).length;
  return saved.filter(i=>Number.isInteger(i)&&i>=0&&i<limit);
}
function saveCompleted(arr){
  try{const all=completionStore(),d=completionDateKey();all[d]=all[d]||{};all[d][completionScope()]=arr;localStorage.setItem("pianoGrindCompletions",JSON.stringify(all));}catch(e){}
}
function getProgressState(){
  try{const all=JSON.parse(localStorage.getItem("pianoGrindProgress")||"{}"),d=all[completionDateKey()]||{};return d[activeDay]||{started:false,resumeIndex:0};}catch(e){return {started:false,resumeIndex:0}}
}
function saveProgressState(patch){
  try{const all=JSON.parse(localStorage.getItem("pianoGrindProgress")||"{}"),d=completionDateKey();all[d]=all[d]||{};all[d][activeDay]=Object.assign(all[d][activeDay]||{started:false,resumeIndex:0},patch);localStorage.setItem("pianoGrindProgress",JSON.stringify(all));}catch(e){}
}
function allBlocksDone(){
  if(isRedo||today==="Sunday")return false;const done=getCompleted();return routine.every((_,i)=>done.includes(i));
}
function markCurrentBlockComplete(){
  const done=getCompleted();
  if(!done.includes(idx)){
    const nextDone=[...done,idx].sort((a,b)=>a-b);
    saveCompleted(nextDone);
    if(!isRedo){
      const nextIncomplete=routine.findIndex((_,i)=>!nextDone.includes(i));
      saveProgressState({started:true,resumeIndex:nextIncomplete<0?idx:nextIncomplete});
    }
  }
  const fullRoutineComplete=allBlocksDone();
  celebrateMascot(fullRoutineComplete);
  renderDoneButton();
  renderPreview();
}

function updateDashboardState(){
  if(today==="Sunday"){

  }
  const done=getCompleted(),p=getProgressState(),count=done.length,totalBlocks=routine.length,complete=count===totalBlocks;
  $("start").style.display="block";$("redoDay").style.display="none";
  if(complete){

  }else if(count>0){
    $("start").textContent="CONTINUE TODAY'S ROUTINE";$("start").disabled=false;$("dayStatus").classList.add("show");$("dayStatus").classList.remove("complete");
    const remainingBlocks=totalBlocks-count;
    const progressMessage=remainingBlocks===1?`<b>One block left.</b> Finish strong.`:remainingBlocks<=3?`<b>Almost done.</b> ${remainingBlocks} blocks to go.`:`<b>You're in.</b> ${count} of ${totalBlocks} blocks marked done.`;

  }else{
    $("start").textContent="LET'S PLAY";$("start").disabled=false;$("dayStatus").classList.remove("show","complete");
  }
}

function loadPreferences(){

    if(t&&!validThemes.includes(t)){localStorage.removeItem("pianoGrindTheme");t=null;}

  btn.textContent="WAITING FOR THE PUSH… LOCK THE SCREEN NOW";

/* ---------- weekly report ---------- */
const DAYS6=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pgWeek(offset){
  const t=new Date();t.setHours(12,0,0,0);const dow=t.getDay(),mon=new Date(t);
  mon.setDate(t.getDate()-(dow===0?6:dow-1)+offset*-7*-1);
  const todayK=dkey(new Date()),store=completionStore(),log=pgLS.get("pianoGrindLog",{}),days=[];let redoBlocks=0,redoMins=0;
  for(let i=0;i<6;i++){
    const dt=new Date(mon);dt.setDate(mon.getDate()+i);const k=dkey(dt),name=DAYS6[i],r=routines[name],L=(log[k]||{})[name],S=(store[k]||{})[name];
    let names=[];if(L&&L.names)names=L.names;else if(Array.isArray(S))names=S.map(x=>r[x]&&r[x][0]).filter(Boolean);
    const lit=r.map(b=>names.includes(b[0])),mins=r.reduce((a,b,j)=>a+(lit[j]?Number(b[1]):0),0);
    const R=(store[k]||{})[name+"__redo"];if(Array.isArray(R)){redoBlocks+=R.length;redoMins+=R.reduce((a,x)=>a+(r[x]?Number(r[x][1]):0),0)}
    days.push({name,k,dt,r,lit,done:lit.filter(Boolean).length,total:r.length,mins,missed:r.filter((b,j)=>!lit[j]).map(b=>b[0]),future:k>todayK||(k===todayK&&!lit.some(Boolean)&&today!=="Sunday"),today:k===todayK});
  }
  return {days,mon,redoBlocks,redoMins};
}
function pgGrade(p,n){
  if(!n)return["Rest week","No practice logged. A week off is data, not a verdict. Start Monday with just the Warm-up."];
  if(p<35)return["Getting started","A few blocks in. The hardest part is the routine itself. Aim to finish Core on three days next week."];
  if(p<60)return["Building","Real work happened. Consistency beats intensity, so protect the days you're strongest."];
  if(p<80)return["Solid week","More than half the routine, most days. A little tightening and this becomes a great week."];
  if(p<95)return["Strong week","You did the work. The skipped blocks below are your free upside."];
  return["Virtuoso week","Practically every block, every day. This is how technique is built. Enjoy your Sunday."];
}
function openReport(offset){
  const W=pgWeek(offset),past=W.days.filter(d=>!d.future),sched=past.reduce((a,d)=>a+d.total,0),done=past.reduce((a,d)=>a+d.done,0),mins=past.reduce((a,d)=>a+d.mins,0);
  const pct=sched?Math.round(done/sched*100):0,pdays=past.filter(d=>d.done>0).length,perfect=past.filter(d=>d.done===d.total).length;
  const coreS=past.reduce((a,d)=>a+8,0),coreD=past.reduce((a,d)=>a+d.lit.slice(0,8).filter(Boolean).length,0),srS=past.length, srD=past.reduce((a,d)=>a+(d.lit[8]?1:0),0),czS=past.length, czD=past.reduce((a,d)=>a+(d.lit[9]?1:0),0);
  const cp=coreS?Math.round(coreD/coreS*100):0,srp=srS?Math.round(srD/srS*100):0,czp=czS?Math.round(czD/czS*100):0;
  const strongWeek=pct>=80;
  const miss={};past.forEach(d=>d.r.forEach((b,j)=>{const m=miss[b[0]]=miss[b[0]]||{s:0,d:0};m.s++;if(d.lit[j])m.d++}));
  const arr=Object.entries(miss),skipped=arr.filter(([n,m])=>m.s-m.d>0).sort((a,b)=>(b[1].s-b[1].d)-(a[1].s-a[1].d)||(b[1].s-b[1].d)/b[1].s-(a[1].s-a[1].d)/a[1].s).slice(0,3),solid=arr.filter(([n,m])=>m.d===m.s&&m.s>=2).slice(0,3);
  const [g,gl]=pgGrade(pct,done),circ=2*Math.PI*45,hm=m=>m>=60?Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m":m+"m";
  const fmtD=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"short"}),range=fmtD(W.days[0].dt)+" – "+fmtD(W.days[5].dt);
  const notes=[];
  if(done){
    if(perfect)notes.push(`${perfect} perfect day${perfect>1?"s":""}: all ${W.days[0].total} blocks.`);
    if(pdays<=3)notes.push("Try for five practice days next week. Even a half-length day keeps the habit alive.");
    if(cp<srp||cp<czp)notes.push("Keep the 120-minute CORE foundation steady, then give Sight-Reading and Czerny their own focused blocks.");
    if(W.redoBlocks)notes.push(`Make-up sessions: ${W.redoBlocks} block${W.redoBlocks>1?"s":""}, ${hm(W.redoMins)} extra. Good recovery.`);
  }
  const focus=skipped.length?`Next week's focus: <b style="display:inline;color:var(--text);font-size:inherit;letter-spacing:0;margin:0">${pgEsc(skipped[0][0])}</b>. Give it the freshest 20 minutes of the session.`:(done?"Nothing skipped. Next week's focus is quality: slower, cleaner, evener.":"Next week's focus: show up for the Warm-up. Everything else follows.");
  const dayRows=W.days.map(d=>{
    const keys=d.r.map((b,j)=>((j===8||j===9)?`<i class="gap"></i>`:"")+`<i class="${d.lit[j]?"on":""}" title="${pgEsc(b[0])}"></i>`).join("");
    const st=d.future?"upcoming":(d.done===d.total?"✓ "+d.done+"/"+d.total:d.done+"/"+d.total)+" · "+hm(d.mins);
    return `<div class="rp-day"><b>${d.name.slice(0,3).toUpperCase()}</b><div class="rp-keys" style="opacity:${d.future?.35:1}">${keys}</div><small>${st}</small>${(!d.future&&d.done&&d.done<d.total)?`<div class="rp-miss">Missed: ${d.missed.map(pgEsc).join(", ")}</div>`:""}${(!d.future&&!d.done&&!d.today)?`<div class="rp-miss">No practice logged.</div>`:""}</div>`}).join("");
  openModal("Weekly Report",`
  <div class="rp-tabs"><button class="mt-chip${offset===-1?" active":""}" data-rp="-1">Last week</button><button class="mt-chip${offset===0?" active":""}" data-rp="0">This week</button></div>
  <div class="rp-hero"><div class="rp-ring"><svg viewBox="0 0 104 104"><circle class="bg" cx="52" cy="52" r="45"/><circle class="fg" cx="52" cy="52" r="45" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${(circ*(1-pct/100)).toFixed(1)}"/></svg><div class="pc">${pct}%</div></div>
  <div><h3>${g}</h3><p>${range}<br>${gl}</p>${strongWeek?`<div class="mascot-card-art" style="height:66px;margin:7px 0 0;max-width:94px">${pgMascotSvg(today,false,"celebrate")}</div>`:""}</div></div>
  <div class="rp-stats"><div class="rp-stat"><b>${pdays}/${past.length}</b><span>DAYS</span></div><div class="rp-stat"><b>${done}/${sched}</b><span>BLOCKS</span></div><div class="rp-stat"><b>${hm(mins)}</b><span>PLAYED</span></div></div>
  <div class="rp-box" style="margin-top:0"><b>EVERY DAY</b>${dayRows}</div>
  <div class="rp-two"><div class="rp-box"><b>CORE · ${cp}%</b>${coreD} of ${coreS} blocks</div><div class="rp-box"><b>SIGHT-READING · ${srp}%</b>${srD} of ${srS} blocks</div></div><div class="rp-box"><b>CZERNY · ${czp}%</b>${czD} of ${czS} blocks · Op. 337 / Op. 740</div>
  <div class="rp-two"><div class="rp-box"><b>MOST SKIPPED</b>${skipped.length?`<ul>${skipped.map(([n,m])=>`<li>${pgEsc(n)} · missed ${m.s-m.d} of ${m.s}</li>`).join("")}</ul>`:"Nothing. Every block you scheduled got done."}</div><div class="rp-box"><b>ROCK SOLID</b>${solid.length?`<ul>${solid.map(([n,m])=>`<li>${pgEsc(n)} · ${m.d}/${m.s}</li>`).join("")}</ul>`:"Nothing repeated every time yet."}</div></div>
  ${notes.length?`<div class="rp-box"><b>COACH NOTES</b><ul>${notes.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
  <div class="rp-box"><b>NEXT WEEK</b>${focus}</div>
  <div class="rp-box"><b>SUNDAY RESET</b><ul><li>Pick one skipped or shaky thing and diagnose it slowly for ten minutes.</li><li>Play something purely for fun. No timer.</li><li>Rest your hands. Set one intention for Monday.</li></ul></div>`);
  document.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>openReport(Number(b.dataset.rp)));
}

<script id="pg-modal-close-safety-fix">
(()=>{
  const modal=document.getElementById("modal");
  const close=document.getElementById("close");
  if(!modal||!close)return;
  const hideModal=()=>{
    modal.classList.remove("open");
    modal.style.zIndex="";
    if(typeof mRAF!=="undefined")cancelAnimationFrame(mRAF);
  };
  close.type="button";
  close.setAttribute("aria-label","Close panel");
  close.onclick=(event)=>{event.preventDefault();event.stopPropagation();hideModal();};
  /* Capture the close action centrally too, so it still works if another panel
     adds a handler to the persistent Close button later. */
  document.addEventListener("click",event=>{
    const target=event.target instanceof Element?event.target.closest("#close"):null;
    if(!target)return;
    event.preventDefault();
    event.stopImmediatePropagation();
    hideModal();
  },true);
  document.addEventListener("keydown",event=>{
    if(event.key==="Escape"&&modal.classList.contains("open"))hideModal();
  });
  modal.addEventListener("click",event=>{
    if(event.target===modal)hideModal();
  });
})();
</script>
