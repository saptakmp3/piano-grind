    <div class="row"><b>Background notifications</b><span>Tap ENABLE → Allow. Then you\'ll get a notification when a block finishes while you\'re away from Piano Grind.</span><button class="secondary" id="enableNotifications" style="margin-top:10px">ENABLE NOTIFICATIONS</button><button class="secondary" id="testNotification" style="margin-top:10px">SEND TEST NOTIFICATION</button></div>\

  $("settingsWeek").onclick=renderFullWeek;

  document.querySelectorAll("[data-sound]").forEach(b=>b.onclick=()=>{sound=b.dataset.sound;localStorage.setItem("pianoGrindSound",sound);document.querySelectorAll("[data-sound]").forEach(x=>x.classList.remove("active"));b.classList.add("active");ping()});
  $("vol").oninput=e=>{volume=e.target.value/100;try{localStorage.setItem("pianoGrindVolume",volume)}catch(x){}if(masterGain)masterGain.gain.value=volume*1.3};$("vol").onchange=ping;
  const nb=$("enableNotifications");if(nb){const refresh=()=>{if(!('Notification' in window)){nb.textContent="NOT SUPPORTED";return;}nb.textContent=Notification.permission==='granted'?"NOTIFICATIONS ON":(Notification.permission==='denied'?"BLOCKED — CHECK BROWSER SETTINGS":"ENABLE NOTIFICATIONS");};refresh();nb.onclick=async()=>{const result=await requestNotificationPermission();if(result==="granted"){try{const reg=await navigator.serviceWorker.ready;await reg.showNotification("Piano Grind — Notifications On",{body:"You're set. Block-finish alerts are enabled.",tag:"piano-grind-setup"})}catch(e){}}else if(result==="denied"){nb.textContent="BLOCKED — ENABLE IN BROWSER SETTINGS"}else if(result==="https-required"){nb.textContent="USE THE HTTPS / GITHUB PAGES VERSION"}else if(result==="unsupported"){nb.textContent="NOT SUPPORTED HERE"}refresh();};}
  const tb=$("testNotification");if(tb){tb.onclick=async()=>{const label=tb.textContent;tb.disabled=true;tb.textContent="SENDING…";try{const result=await requestNotificationPermission();if(result!=="granted"){tb.textContent=result==="denied"?"BLOCKED — ENABLE IN BROWSER SETTINGS":result==="https-required"?"USE THE HTTPS / GITHUB PAGES VERSION":result==="unsupported"?"NOT SUPPORTED HERE":"COULD NOT ENABLE";setTimeout(()=>{tb.disabled=false;tb.textContent=label},2200);return;}await pgSubscribe();if(!pgSubJson)throw new Error("no subscription");const r=await fetch(PG_URL+"/schedule",{method:"POST",headers:{"content-type":"text/plain"},body:JSON.stringify({sub:pgSubJson,at:Date.now()+1000,title:"Piano Grind — Test Notification",body:"Cloudflare push is working. 🎹"}),keepalive:true});if(!r.ok)throw new Error("schedule failed");tb.textContent="TEST SCHEDULED";}catch(e){tb.textContent="TEST FAILED"}setTimeout(()=>{tb.disabled=false;tb.textContent=label},2600)};}
}

<script id="streak-logic">
(function(){
  const KEY="pianoGrindStreak";
  function todayKey(){
    const d=new Date();
    return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0");
  }
  function dateFromKey(k){
    const p=k.split("-").map(Number);
    return new Date(p[0],p[1]-1,p[2]);
  }
  function loadStreak(){
    try{return JSON.parse(localStorage.getItem(KEY)||'{"count":0,"last":""}')}
    catch(e){return {count:0,last:""}}
  }
  function updateBadge(){
    const s=loadStreak(), el=document.getElementById("streakCount");
    if(el) el.textContent=s.count||0;
  }
  function markRoutineComplete(){
    const s=loadStreak(), t=todayKey();
    if(s.last===t) return;
    const before={count:s.count||0,last:s.last||""};
    if(s.last){
      const diff=Math.round((dateFromKey(t)-dateFromKey(s.last))/86400000);
      s.count=(diff===1?(s.count||0)+1:1);
    }else s.count=1;
    s.last=t;
    s.beforeToday=before;
    localStorage.setItem(KEY,JSON.stringify(s));
    updateBadge();
    if(typeof renderPreview==="function") renderPreview();
  }
  window.pianoGrindMarkComplete=markRoutineComplete;
  window.pianoGrindUncomplete=function(){
    const s=loadStreak(),t=todayKey();
    if(s.last!==t)return;
    // Restore the streak state from before today's completion. Re-completing today will count normally again.
    const before=s.beforeToday||{count:0,last:""};
    s.count=before.count||0;
    s.last=before.last||"";
    delete s.beforeToday;
    localStorage.setItem(KEY,JSON.stringify(s));
    updateBadge();
  };
  updateBadge();
})();
</script>
<script id="streak-button-action">
(function(){
  const b=document.getElementById("streakButton");
  if(!b) return;
  b.onclick=function(){
    let s={count:0,last:""};

    const n=s.count||0;
    openModal("🔥 Streak",`
      <div class="row"><b>${n} ${n===1?"day":"days"}</b><span>Complete the full routine tomorrow to keep it going.</span></div>
    `);
  };
})();
</script>
