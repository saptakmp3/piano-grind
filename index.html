<style id="completion-controls-css">
.practice-count{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;}
.practice-settings{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:18px;margin-left:auto;}
.practice-back{width:42px;height:42px;padding:0;display:grid;place-items:center;justify-self:start;}
.practice-back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.practice-back:active,.practice-settings:active{transform:scale(.95);}
.practice-top{align-items:center;}
.done-area{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;gap:7px;margin:12px auto 14px;}
.done-button{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,280px);min-height:52px;padding:0 18px;border:1px solid rgba(255,255,255,.12);border-bottom-color:rgba(0,0,0,.55);border-radius:12px;background:linear-gradient(180deg,#282c35 0%,#1b1e25 48%,#15171d 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.34),0 10px 22px rgba(0,0,0,.24);color:#d9dce4;cursor:pointer;font:800 12px/1 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.13em;text-transform:uppercase;transition:transform .14s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease,color .18s ease;}
.done-button:active{transform:translateY(1px);}
.done-button .led{width:9px;height:9px;border-radius:50%;background:#555b68;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);transition:all .18s ease;}
.done-button .done-check{font-size:16px;line-height:1;color:#777d88;transition:color .18s ease;}
.done-button.is-done{color:var(--theme-accent);border-color:var(--theme-glow);background:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.025) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.35),0 0 0 1px var(--theme-glow),0 0 28px var(--theme-glow);}
.done-button.is-done .led{background:var(--theme-accent);box-shadow:0 0 5px var(--theme-accent),0 0 14px var(--theme-glow);}
.done-button.is-done .done-check{color:var(--theme-accent);}
.day{position:relative;overflow:hidden;transition:transform .16s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease;}
.day.completed{border-color:var(--theme-glow);background:linear-gradient(145deg,var(--theme-bg1),var(--theme-bg2));box-shadow:0 0 24px var(--theme-glow),inset 0 0 0 1px var(--theme-glow);}
.day.completed:after{content:"✓";position:absolute;right:11px;top:9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--theme-accent);background:var(--theme-glow);border:1px solid var(--theme-glow);font-size:13px;font-weight:900;}
.day-status{display:none;margin:16px 0 4px;padding:13px 15px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);color:#dfe1e8;}
.day-status.show{display:flex;align-items:center;gap:10px;}
.day-status .status-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-accent);box-shadow:0 0 10px var(--theme-glow);flex:none;}
.day-status.complete{border-color:var(--theme-glow);background:linear-gradient(135deg,var(--theme-bg1),var(--theme-bg2));}
.day-status.complete .status-dot{background:var(--theme-accent);box-shadow:0 0 12px var(--theme-glow);}
.primary[disabled]{cursor:default;opacity:.78;box-shadow:none !important;}
@media(max-width:480px){.done-button{min-height:34px}}
</style>

const MOTIVE=["Slow is smooth. Smooth becomes fast.","Every clean rep is a vote for who you become.","Evenness first. Speed is a by-product.","Drop the shoulders. Breathe.","Listen harder than you play.","Boring today, brilliant tomorrow.","Loose hands, sharp ears.","Small corrections, every single day.","Nobody can take this work away from you.","Clean first. Then fast. Never the reverse.","Your future hands are being built right now.","Stay on the hard part. That's where you grow.","Patience is a technique too.","One more perfect pass.","Show up. Play it slow. Play it right."];
let qTimer=null,qBag=[];
function quoteNext(){if(!qBag.length){qBag=MOTIVE.slice();for(let i=qBag.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[qBag[i],qBag[j]]=[qBag[j],qBag[i]]}}return qBag.pop()}
function quoteSchedule(ms){clearTimeout(qTimer);qTimer=setTimeout(quoteShow,ms)}
function quoteShow(){const el=$("motive");if(!el||!running||remaining<25){quoteSchedule(20000);return}
  el.textContent=quoteNext();el.classList.add("show");
  qTimer=setTimeout(()=>{el.classList.remove("show");quoteSchedule(30000+Math.random()*30000)},12000)}
function quoteStart(){if(!qTimer)quoteSchedule(5000)}
function quoteStop(){clearTimeout(qTimer);qTimer=null;const el=$("motive");if(el)el.classList.remove("show")}
async function requestNotificationPermission(){
  try{
    if(!('Notification' in window)) return "unsupported";
    if(!('serviceWorker' in navigator)) return "unsupported";
    if(!(location.protocol==='https:' || location.hostname==='localhost')) return "https-required";
    let reg=await navigator.serviceWorker.getRegistration();
    if(!reg) reg=await navigator.serviceWorker.register('./sw.js',{scope:'./'});
    let perm=Notification.permission;if(perm==='default')perm=await Notification.requestPermission();
    if(perm==='granted')try{await pgSubscribe()}catch(e){}
    return perm;
  }catch(e){
    return "error";
  }
}
async function notifyTimerEvent(title,body,force=false){
  if(pgSubJson||document.visibilityState==="visible") return; // server push covers the background; in-app sound covers the foreground
  try{
    if(!('Notification' in window)) return;
    if(Notification.permission!=='granted') return;
    const reg=navigator.serviceWorker ? await navigator.serviceWorker.getRegistration() : null;
    if(reg && reg.showNotification){
      await reg.showNotification(`Piano Grind — ${title}`,{body,tag:'piano-grind-timer',renotify:true,icon:'./icons/icon-192.png'});
    }else{
      new Notification(`Piano Grind — ${title}`,{body,tag:'piano-grind-timer',renotify:true,icon:'./icons/icon-192.png'});
    }
  }catch(e){}
}
$("exitPractice").onclick=()=>{
  if(!isRedo)saveProgressState({started:true,resumeIndex:idx});
  stopTicker();running=false;lastClockAt=0;endAt=0;clearTimerState();isRedo=false;setTimeout(()=>{if(!running)try{audioCtx&&audioCtx.suspend()}catch(e){}},6000);activeDay=today;routine=routines[today];
  $("session").style.display="none";$("preview").style.display="block";$("quote").style.display="block";$("moods").style.display="flex";$("greeting").style.display="block";$("settings").style.display="block";$("date").style.display="block";renderPreview();
};
$("start").onclick=()=>{
  const saved=readSavedTimerState();
  if(saved){
    if(enterSavedTimer())return;
  }
  start();
};
$("pause").onclick=()=>{
  if(!$("session").style.display || $("session").style.display==="none") return;
  if(running){
    reconcileElapsed();if(!running)return;
    remaining=Math.max(0,Math.ceil((endAt-Date.now())/1000));running=false;lastClockAt=0;endAt=0;$("pause").textContent="RESUME";saveTimerState();stopTicker();
  }else{
    running=true;endAt=Date.now()+remaining*1000;$("pause").textContent="PAUSE";ping();saveTimerState();startTicker();
  }
};
$("next").onclick=()=>{if(idx<routine.length-1){idx++;load(idx);running=false;endAt=0;$("pause").textContent="START";if(!isRedo)saveProgressState({started:true,resumeIndex:idx});saveTimerState()}};
$("prev").onclick=()=>{if(idx>0){idx--;load(idx);running=false;endAt=0;$("pause").textContent="START";if(!isRedo)saveProgressState({started:true,resumeIndex:idx});saveTimerState()}};
$("markDone").onclick=()=>{
  const done=getCompleted();
  const wasDone=done.includes(idx);
  if(wasDone){
    const nextDone=done.filter(i=>i!==idx);
    saveCompleted(nextDone);
    if(!isRedo){
      const nextIncomplete=routine.findIndex((_,i)=>!nextDone.includes(i));
      saveProgressState({started:true,resumeIndex:nextIncomplete<0?idx:nextIncomplete});
    }
    renderDoneButton();
    renderPreview();
  }else{
    markCurrentBlockComplete();
  }
  const count=getCompleted().length;
  $("prog").textContent=`${count} / ${routine.length} blocks completed · ${Math.round(count/routine.length*100)}%`;
};
document.addEventListener("visibilitychange",()=>{
  if(document.visibilityState==="visible"){
    reconcileElapsed();
    if(running){startTicker();}
  }else if(running){
    saveTimerState();
  }
});
window.addEventListener("pagehide",()=>{if(running)saveTimerState();});
// Always land on the dashboard when the page is opened/reloaded.
// A saved timer is recovered only when the user taps CONTINUE TODAY'S ROUTINE.
const _savedTimerOnOpen=readSavedTimerState();
if(_savedTimerOnOpen){
  restoreTimerState(false);
}else{
  updateDashboardState();
}


function renderFullWeek(){
  const order=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday","Sunday"];
  const cards=order.map(d=>{
    if(d==="Sunday") return `<div class="row"><b>Sunday</b><span>Rest day — mostly. Diagnose, play for fun.</span></div>`;
    return `<div class="row"><b>${d}</b><span>${["Core","Spotlight"].map(sn=>`<small style="color:var(--theme-accent);font-weight:800;letter-spacing:.1em">${sn.toUpperCase()}</small> ${routines[d].filter((x,j)=>secName(d,j)===sn).map(x=>`${x[0]} — ${x[1]} min`).join(" · ")}`).join("<br>")}<br><small style="color:var(--theme-accent)">${routines[d].length} blocks · ${(t=>Math.floor(t/60)+"h "+(t%60)+"m")(routines[d].reduce((s,x)=>s+Number(x[1]),0))}</small></span></div>`;
  }).join("");
  openModal("Full Week",cards);
}
function applyThemeName(t,persist=true){
  const themes={
    violet:{a:"#b18cff",b:"#7657ff",g:"rgba(118,87,255,.24)",bg1:"rgba(116,88,255,.18)",bg2:"rgba(198,110,255,.12)",base:"#0c0b14"},
    ocean:{a:"#42c7e6",b:"#168bb1",g:"rgba(22,139,177,.24)",bg1:"rgba(48,194,230,.17)",bg2:"rgba(49,102,255,.10)",base:"#081116"},
    ember:{a:"#ffad70",b:"#ef6638",g:"rgba(239,102,56,.24)",bg1:"rgba(255,120,55,.20)",bg2:"rgba(255,63,91,.12)",base:"#130d0b"},
    mint:{a:"#7ee6bc",b:"#34bd87",g:"rgba(52,189,135,.23)",bg1:"rgba(68,213,165,.16)",bg2:"rgba(68,139,255,.08)",base:"#09120f"}
  };const m=themes[t]||themes.violet;
  document.documentElement.style.setProperty("--theme-accent",m.a);document.documentElement.style.setProperty("--theme-accent2",m.b);document.documentElement.style.setProperty("--theme-glow",m.g);document.documentElement.style.setProperty("--theme-bg1",m.bg1);document.documentElement.style.setProperty("--theme-bg2",m.bg2);document.documentElement.style.setProperty("--theme-base",m.base);document.documentElement.style.setProperty("--accent",m.a);document.documentElement.style.setProperty("--accent2",m.b);if(persist)localStorage.setItem("pianoGrindTheme",t);
}
function loadPreferences(){
  try{const t=localStorage.getItem("pianoGrindTheme");if(t)applyThemeName(t,false);const snd=localStorage.getItem("pianoGrindSound");if(snd)sound=snd;}catch(e){}
}
loadPreferences();
function renderSettings(){
  openModal("Settings",`\
    <div class="row"><b>Full Week</b><span>Open the complete 7-day calendar.</span><button class="secondary" id="settingsWeek" style="margin-top:10px">VIEW FULL WEEK</button></div>\
    <div class="row"><b>Colour theme</b><div class="theme"><button style="background:#a78bfa" data-theme="violet" aria-label="Violet"></button><button style="background:#39b6d9" data-theme="ocean" aria-label="Ocean"></button><button style="background:#ff8a4c" data-theme="ember" aria-label="Ember"></button><button style="background:#78e0b0" data-theme="mint" aria-label="Mint"></button></div></div>\
    <div class="row"><b>Timer sound</b><div class="sound"><button data-sound="bell" class="${sound==="bell"?"active":""}">🔔 Bell</button><button data-sound="chime" class="${sound==="chime"?"active":""}">✨ Chime</button><button data-sound="piano" class="${sound==="piano"?"active":""}">🎹 Piano</button><button data-sound="wood" class="${sound==="wood"?"active":""}">🪵 Wood</button><button data-sound="bowl" class="${sound==="bowl"?"active":""}">🥣 Bowl</button></div><input class="vol" id="vol" type="range" min="0" max="100" value="${Math.round(volume*100)}" aria-label="Volume"></div>\
    <div class="row"><b>Background notifications</b><span>Tap ENABLE → Allow. Then you\'ll get a notification when a block finishes while you\'re away from Piano Grind.</span><button class="secondary" id="enableNotifications" style="margin-top:10px">ENABLE NOTIFICATIONS</button><button class="secondary" id="testNotification" style="margin-top:8px">SEND TEST NOTIFICATION</button><span id="pushStatus" style="margin-top:10px"></span></div>\
  `);
  $("settingsWeek").onclick=renderFullWeek;
  pgDiag().then(t=>{const e=$("pushStatus");if(e)e.textContent=t});
  document.querySelectorAll("[data-theme]").forEach(b=>b.onclick=()=>{applyThemeName(b.dataset.theme,true);renderSettings();});
  document.querySelectorAll("[data-sound]").forEach(b=>b.onclick=()=>{sound=b.dataset.sound;localStorage.setItem("pianoGrindSound",sound);document.querySelectorAll("[data-sound]").forEach(x=>x.classList.remove("active"));b.classList.add("active");ping(true)});
  $("vol").oninput=e=>setVolume(e.target.value/100);$("vol").onchange=()=>ping(false);
  const nb=$("enableNotifications");if(nb){const refresh=()=>{if(!('Notification' in window)){nb.textContent="NOT SUPPORTED";return;}nb.textContent=Notification.permission==='granted'?"NOTIFICATIONS ON":(Notification.permission==='denied'?"BLOCKED — CHECK BROWSER SETTINGS":"ENABLE NOTIFICATIONS");};refresh();nb.onclick=async()=>{const result=await requestNotificationPermission();if(result==="granted"){try{const reg=await navigator.serviceWorker.ready;await reg.showNotification("Piano Grind — Notifications On",{body:"You're set. Block-finish alerts are enabled.",tag:"piano-grind-setup"})}catch(e){}}else if(result==="denied"){nb.textContent="BLOCKED — ENABLE IN BROWSER SETTINGS"}else if(result==="https-required"){nb.textContent="NEEDS HTTPS"}else if(result==="unsupported"){nb.textContent="NOT SUPPORTED HERE"}refresh();};}
  const tn=$("testNotification");if(tn){tn.onclick=async()=>{
    tn.textContent="SENDING…";tn.disabled=true;
    try{
      const result=await requestNotificationPermission();
      if(result!=="granted"){tn.textContent=result==="denied"?"BLOCKED — CHECK BROWSER SETTINGS":result==="https-required"?"NEEDS HTTPS":result==="unsupported"?"NOT SUPPORTED HERE":"ENABLE NOTIFICATIONS FIRST";setTimeout(()=>{tn.textContent="SEND TEST NOTIFICATION";tn.disabled=false},2200);return;}
      if(!pgOn()){tn.textContent="WORKER URL NOT SET";setTimeout(()=>{tn.textContent="SEND TEST NOTIFICATION";tn.disabled=false},2200);return;}
      if(!pgSubJson)await pgSubscribe();
      if(!pgSubJson)throw new Error("No push subscription");
      const res=await fetch(PG_URL+"/schedule",{method:"POST",headers:{"content-type":"text/plain"},body:JSON.stringify({sub:pgSubJson,at:Date.now()+5000,title:"Test",body:"Test notification received. Your background notifications are working."})});
      if(!res.ok)throw new Error("Schedule failed");
      tn.textContent="SENT — LEAVE THE APP / LOCK NOW (≈5s)";
    }catch(e){tn.textContent="TEST FAILED — TRY AGAIN";}
    setTimeout(()=>{tn.textContent="SEND TEST NOTIFICATION";tn.disabled=false},3000);
  };}
}

    if('serviceWorker' in navigator && (location.protocol==='https:' || location.hostname==='localhost')){
      navigator.serviceWorker.register('./sw.js',{scope:'./'}).catch(()=>{});
    }

<script id="redo-day-script">

function openRedoDayPicker(){
  const order=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
  const body=order.map(d=>`<button class="secondary redo-choice" data-day="${d}" style="margin:5px 0">${d}</button>`).join("");
  openModal("Redo a Day",`
    <div class="row"><b>Make-up session</b><span>Choose any training day to run again. This is extra practice on top of your normal day.</span></div>
    ${body}
  `);
  document.querySelectorAll(".redo-choice").forEach(b=>b.onclick=()=>{
    activeDay=b.dataset.day;
