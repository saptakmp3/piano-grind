<style id="completion-controls-css">
.practice-count{position:absolute;left:50%;transform:translateX(-50%);white-space:nowrap;}
.practice-settings{width:42px;height:42px;padding:0;display:grid;place-items:center;font-size:18px;margin-left:auto;}
.practice-back{width:42px;height:42px;padding:0;display:grid;place-items:center;justify-self:start;}
.practice-back svg{width:20px;height:20px;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;}
.practice-back:active,.practice-settings:active{transform:scale(.95);}
.practice-top{align-items:center;}
.done-area{width:min(100%,420px);display:flex;flex-direction:column;align-items:center;gap:7px;margin:12px auto 14px;}
.done-button{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;width:min(100%,280px);min-height:52px;padding:0 18px;border:1px solid rgba(255,255,255,.12);border-bottom-color:rgba(0,0,0,.55);border-radius:12px;background:linear-gradient(180deg,#282c35 0%,#1b1e25 48%,#15171d 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.10),inset 0 -2px 0 rgba(0,0,0,.34),0 10px 22px rgba(0,0,0,.24);color:#d9dce4;cursor:pointer;font:800 12px/1 Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;letter-spacing:.13em;text-transform:uppercase;transition:transform .14s ease,box-shadow .18s ease,border-color .18s ease,background .18s ease,color .18s ease;}
.done-button:active{transform:translateY(1px);}
.done-button .led{width:9px;height:9px;border-radius:50%;background:#555b68;box-shadow:inset 0 1px 2px rgba(0,0,0,.6);transition:all .18s ease;}
.done-button .done-check{font-size:16px;line-height:1;color:#777d88;transition:color .18s ease;}
.done-button.is-done{color:var(--theme-accent);border-color:var(--theme-glow);background:linear-gradient(180deg,rgba(255,255,255,.055) 0%,rgba(255,255,255,.025) 100%);box-shadow:inset 0 1px 0 rgba(255,255,255,.08),inset 0 -2px 0 rgba(0,0,0,.35),0 0 0 1px var(--theme-glow),0 0 28px var(--theme-glow);}
.done-button.is-done .led{background:var(--theme-accent);box-shadow:0 0 5px var(--theme-accent),0 0 14px var(--theme-glow);}
.done-button.is-done .done-check{color:var(--theme-accent);}
.day{position:relative;overflow:hidden;transition:transform .16s ease,border-color .2s ease,box-shadow .2s ease,background .2s ease;}
.day.completed{border-color:var(--theme-glow);background:linear-gradient(145deg,var(--theme-bg1),var(--theme-bg2));box-shadow:0 0 24px var(--theme-glow),inset 0 0 0 1px var(--theme-glow);}
.day.completed:after{content:"✓";position:absolute;right:11px;top:9px;width:22px;height:22px;border-radius:50%;display:grid;place-items:center;color:var(--theme-accent);background:var(--theme-glow);border:1px solid var(--theme-glow);font-size:13px;font-weight:900;}
.day-status{display:none;margin:16px 0 4px;padding:13px 15px;border-radius:16px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.055);color:#dfe1e8;}
.day-status.show{display:flex;align-items:center;gap:10px;}
.day-status .status-dot{width:9px;height:9px;border-radius:50%;background:var(--theme-accent);box-shadow:0 0 10px var(--theme-glow);flex:none;}
.day-status.complete{border-color:var(--theme-glow);background:linear-gradient(135deg,var(--theme-bg1),var(--theme-bg2));}
.day-status.complete .status-dot{background:var(--theme-accent);box-shadow:0 0 12px var(--theme-glow);}
.primary[disabled]{cursor:default;opacity:.78;box-shadow:none !important;}
@media(max-width:480px){.done-button{min-height:34px}}
</style>

/* ---------- metronome ---------- */
const MET_KEY="pianoGrindMetro";
const metro=Object.assign({bpm:80,num:4,den:4,sub:1,acc:null,snd:"click",vol:.8,tr:{on:false,every:4,step:2,max:120}},pgLS.get(MET_KEY,{}));
metro.running=false;
function metDefAcc(n,d){const a=Array(n).fill(1);a[0]=3;if(d===8&&n%3===0&&n>=6){for(let i=3;i<n;i+=3)a[i]=2}else if(n===5&&d===4)a[3]=2;else if(n===7)a[2]=a[4]=2;return a}
if(!Array.isArray(metro.acc)||metro.acc.length!==metro.num)metro.acc=metDefAcc(metro.num,metro.den);
const metSave=()=>{const c=Object.assign({},metro);delete c.running;pgLS.set(MET_KEY,c)};
const MET_NAMES=[[40,"Grave"],[60,"Largo"],[66,"Larghetto"],[76,"Adagio"],[108,"Andante"],[120,"Moderato"],[156,"Allegro"],[176,"Vivace"],[200,"Presto"],[999,"Prestissimo"]];
const metName=b=>(MET_NAMES.find(x=>b<x[0])||MET_NAMES[9])[1];
let mGain=null,mTimer=null,mNext=0,mBeat=0,mSub=0,mBars=0,mCount=0,mLog=[],mRAF=0,mTaps=[];
function mClick(t,level,isSub){
  const c=audioCtx;if(!mGain||mGain.context!==c){mGain=c.createGain();mGain.connect(c.destination)}mGain.gain.value=metro.vol;
  const o=c.createOscillator(),g=c.createGain(),lv=isSub?0:level,a=isSub?.3:[0,.45,.72,1][level];
  const F={click:[900,1300,1750,2300],wood:[520,700,900,1100],soft:[523,659,784,988]}[metro.snd]||[900,1300,1750,2300];
  const f=isSub?F[0]*.85:F[lv],dec=metro.snd==="soft"?.14:metro.snd==="wood"?.08:.05;
  o.type=metro.snd==="click"?"triangle":"sine";o.frequency.value=f;
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(Math.max(.001,a),t+.002);g.gain.exponentialRampToValueAtTime(.0001,t+dec);
  o.connect(g);g.connect(mGain);o.start(t);o.stop(t+dec+.03);
  if(metro.snd==="wood"&&!isSub){const o2=c.createOscillator(),g2=c.createGain();o2.frequency.value=f*2.4;g2.gain.setValueAtTime(a*.3,t);g2.gain.exponentialRampToValueAtTime(.0001,t+.03);o2.connect(g2);g2.connect(mGain);o2.start(t);o2.stop(t+.05)}
}
function mSchedule(){
  const c=audioCtx;if(!c)return;
  while(mNext<c.currentTime+.12){
    const lvl=metro.acc[mBeat]||0;
    if(mSub===0){if(lvl>0)mClick(mNext,lvl,false);mLog.push({t:mNext,b:mBeat,k:mCount++});if(mLog.length>12)mLog.shift()}
    else mClick(mNext,1,true);
    mSub++;
    if(mSub>=metro.sub){mSub=0;mBeat++;if(mBeat>=metro.num){mBeat=0;mBars++;
      if(metro.tr.on&&mBars%metro.tr.every===0&&metro.bpm<metro.tr.max){metro.bpm=Math.min(metro.tr.max,metro.bpm+metro.tr.step);metSave();mPaintBpm()}}}
    mNext+=60/metro.bpm/metro.sub;
  }
}
async function mStart(){
  const c=await readyAudio();mNext=c.currentTime+.1;mBeat=0;mSub=0;mBars=0;mCount=0;mLog=[];
  clearInterval(mTimer);mTimer=setInterval(mSchedule,25);metro.running=true;mPaintRun();mFrame();
}
function mStop(){clearInterval(mTimer);mTimer=null;metro.running=false;mPaintRun()}
function mPaintRun(){
  const b=$("mtGo");if(b)b.textContent=metro.running?"■  STOP":"▶  START";
  [$("metroBtn"),$("metroBtn2")].forEach(x=>x&&x.classList.toggle("on",metro.running));
}
function mPaintBpm(){
  const n=$("mtN");if(!n)return;n.textContent=metro.bpm;$("mtName").textContent=metName(metro.bpm);$("mtRange").value=metro.bpm;
  const t=(metro.bpm-20)/280,y=62+t*118,w=$("mtWt");if(w)w.setAttribute("y",y);
}
function mFrame(){
  cancelAnimationFrame(mRAF);
  const sw=$("mtSwing");if(!sw||!$("modal").classList.contains("open")){return}
  const c=audioCtx,now=c?c.currentTime:0,rod=$("mtRod");let ang=0,act=-1;
  if(metro.running&&c&&mLog.length){
    let cur=null;for(const e of mLog)if(e.t<=now)cur=e;
    if(cur){const ph=Math.min(1,(now-cur.t)/(60/metro.bpm));ang=(cur.k%2===0?1:-1)*26*Math.cos(Math.PI*ph);act=cur.b}
  }

  mRAF=requestAnimationFrame(mFrame);
}
function mDots(){
  const box=$("mtDots");if(!box)return;box.innerHTML=metro.acc.map((l,i)=>`<button class="mt-dot l${l}" data-i="${i}" aria-label="Beat ${i+1}"></button>`).join("");
  box.querySelectorAll(".mt-dot").forEach(d=>d.onclick=()=>{const i=+d.dataset.i;metro.acc[i]=(metro.acc[i]+1)%4;if(metro.acc[i]===0&&metro.acc.every(x=>x===0))metro.acc[i]=1;metSave();mDots()});
}
function mSetSig(n,d){metro.num=Math.max(1,Math.min(16,n));metro.den=d;metro.acc=metDefAcc(metro.num,metro.den);mBeat=0;metSave();metOpen()}
function mBump(d){metro.bpm=Math.max(20,Math.min(300,metro.bpm+d));metSave();mPaintBpm()}
function metOpen(){
  const sigs=[[2,4],[3,4],[4,4],[5,4],[6,8],[7,8],[9,8],[12,8]],subs=[[1,"♩"],[2,"♪♪"],[3,"♪♪♪ triplet"],[4,"♬♬ 16ths"]];
  openModal("Metronome",`
  <div class="mt-top">
    <svg class="mt-swing" id="mtSwing" viewBox="0 0 200 260" aria-hidden="true"><path class="body" d="M52 252 L148 252 L120 118 L80 118 Z"/><g id="mtRod"><line class="rod" x1="100" y1="215" x2="100" y2="38"/><rect class="wt" id="mtWt" x="86" y="100" width="28" height="22" rx="6"/></g><circle class="piv" cx="100" cy="215" r="7"/></svg>
    <div class="mt-bpm"><div class="n" id="mtN">${metro.bpm}</div><div class="u">BPM · ${metro.den===8?"♪":"♩"} = ${metro.bpm}</div><div class="nm" id="mtName">${metName(metro.bpm)}</div><div class="mt-dots" id="mtDots"></div></div>
  </div>
  <div class="mt-tempo"><button class="secondary" data-b="-5">−5</button><button class="secondary" data-b="-1">−</button><input type="range" id="mtRange" min="20" max="300" value="${metro.bpm}" aria-label="Tempo"><button class="secondary" data-b="1">＋</button><button class="secondary" data-b="5">+5</button></div>

  <div class="mt-lbl">Time signature</div><div class="mt-chips">${sigs.map(([n,d])=>`<button class="mt-chip${metro.num===n&&metro.den===d?" active":""}" data-sig="${n}/${d}">${n}/${d}</button>`).join("")}</div>
  <div class="mt-lbl">Custom</div><div class="mt-chips" style="align-items:center"><span class="mt-step"><button class="secondary" id="mtNm">−</button><span>${metro.num}</span><button class="secondary" id="mtNp">＋</button></span><span style="color:var(--muted)">beats of</span>${[2,4,8,16].map(d=>`<button class="mt-chip${metro.den===d?" active":""}" data-den="${d}">${d}</button>`).join("")}</div>
  <div class="mt-lbl">Subdivision</div><div class="mt-chips">${subs.map(([v,l])=>`<button class="mt-chip${metro.sub===v?" active":""}" data-sub="${v}">${l}</button>`).join("")}</div>
  <div class="mt-lbl">Sound</div><div class="mt-chips">${[["click","Click"],["wood","Wood"],["soft","Soft"]].map(([v,l])=>`<button class="mt-chip${metro.snd===v?" active":""}" data-snd="${v}">${l}</button>`).join("")}</div>
  <input class="vol" id="mtVol" type="range" min="5" max="100" value="${Math.round(metro.vol*100)}" aria-label="Metronome volume">
  <div class="mt-lbl">Speed trainer</div>
  <div class="mt-train"><div class="r"><span>Raise the tempo automatically</span><button class="mt-chip${metro.tr.on?" active":""}" id="mtTrOn">${metro.tr.on?"ON":"OFF"}</button></div>
  <div class="r"><span>Every</span><span class="mt-step"><button class="secondary" data-tr="every-1">−</button><span>${metro.tr.every}</span><button class="secondary" data-tr="every+1">＋</button></span><span>bars</span></div>

  <div style="color:var(--muted);font-size:12px;margin-top:14px;line-height:1.5">Tap a beat dot to cycle strong, medium, normal and silent. The metronome keeps running if you close this sheet.</div>`);
  mDots();mPaintBpm();mFrame();
  $("mtGo").onclick=()=>metro.running?mStop():mStart();

/* ---------- weekly report ---------- */
const DAYS6=["Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
function dkey(d){return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")}
function pgWeek(offset){
  const t=new Date();t.setHours(12,0,0,0);const dow=t.getDay(),mon=new Date(t);
  mon.setDate(t.getDate()-(dow===0?6:dow-1)+offset*-7*-1);
  const todayK=dkey(new Date()),store=completionStore(),log=pgLS.get("pianoGrindLog",{}),days=[];let redoBlocks=0,redoMins=0;
  for(let i=0;i<6;i++){
    const dt=new Date(mon);dt.setDate(mon.getDate()+i);const k=dkey(dt),name=DAYS6[i],r=routines[name],L=(log[k]||{})[name],S=(store[k]||{})[name];
    let names=[];if(L&&L.names)names=L.names;else if(Array.isArray(S))names=S.map(x=>r[x]&&r[x][0]).filter(Boolean);
    const lit=r.map(b=>names.includes(b[0])),mins=r.reduce((a,b,j)=>a+(lit[j]?Number(b[1]):0),0);
    const R=(store[k]||{})[name+"__redo"];if(Array.isArray(R)){redoBlocks+=R.length;redoMins+=R.reduce((a,x)=>a+(r[x]?Number(r[x][1]):0),0)}
    days.push({name,k,dt,r,lit,done:lit.filter(Boolean).length,total:r.length,mins,missed:r.filter((b,j)=>!lit[j]).map(b=>b[0]),future:k>todayK||(k===todayK&&!lit.some(Boolean)&&today!=="Sunday"),today:k===todayK});
  }
  return {days,mon,redoBlocks,redoMins};
}
function pgGrade(p,n){
  if(!n)return["Rest week","No practice logged. A week off is data, not a verdict. Start Monday with just the Warm-up."];
  if(p<35)return["Getting started","A few blocks in. The hardest part is the routine itself. Aim to finish Core on three days next week."];
  if(p<60)return["Building","Real work happened. Consistency beats intensity, so protect the days you're strongest."];
  if(p<80)return["Solid week","More than half the routine, most days. A little tightening and this becomes a great week."];
  if(p<95)return["Strong week","You did the work. The skipped blocks below are your free upside."];
  return["Virtuoso week","Practically every block, every day. This is how technique is built. Enjoy your Sunday."];
}
function openReport(offset){
  const W=pgWeek(offset),past=W.days.filter(d=>!d.future),sched=past.reduce((a,d)=>a+d.total,0),done=past.reduce((a,d)=>a+d.done,0),mins=past.reduce((a,d)=>a+d.mins,0);
  const pct=sched?Math.round(done/sched*100):0,pdays=past.filter(d=>d.done>0).length,perfect=past.filter(d=>d.done===d.total).length;
  const coreS=past.reduce((a,d)=>a+SPOT,0),coreD=past.reduce((a,d)=>a+d.lit.slice(0,SPOT).filter(Boolean).length,0),spS=past.reduce((a,d)=>a+d.total-SPOT,0),spD=done-coreD;
  const cp=coreS?Math.round(coreD/coreS*100):0,sp=spS?Math.round(spD/spS*100):0;
  const miss={};past.forEach(d=>d.r.forEach((b,j)=>{const m=miss[b[0]]=miss[b[0]]||{s:0,d:0};m.s++;if(d.lit[j])m.d++}));
  const arr=Object.entries(miss),skipped=arr.filter(([n,m])=>m.s-m.d>0).sort((a,b)=>(b[1].s-b[1].d)-(a[1].s-a[1].d)||(b[1].s-b[1].d)/b[1].s-(a[1].s-a[1].d)/a[1].s).slice(0,3),solid=arr.filter(([n,m])=>m.d===m.s&&m.s>=2).slice(0,3);
  const [g,gl]=pgGrade(pct,done),circ=2*Math.PI*45,hm=m=>m>=60?Math.floor(m/60)+"h "+String(m%60).padStart(2,"0")+"m":m+"m";
  const fmtD=d=>d.toLocaleDateString(undefined,{day:"numeric",month:"short"}),range=fmtD(W.days[0].dt)+" – "+fmtD(W.days[5].dt);
  const notes=[];
  if(done){
    if(perfect)notes.push(`${perfect} perfect day${perfect>1?"s":""}: all ${W.days[0].total} blocks.`);
    if(pdays<=3)notes.push("Try for five practice days next week. Even a half-length day keeps the habit alive.");
    if(cp-sp>=15)notes.push("Spotlight is where it slips. Those blocks come after the break, so keep the break to five minutes and go back in.");
    else if(sp-cp>=15)notes.push("You're finishing Spotlight but skipping Core blocks. Don't skip the Warm-up and Sight-Reading, they set up everything else.");
    if(W.redoBlocks)notes.push(`Make-up sessions: ${W.redoBlocks} block${W.redoBlocks>1?"s":""}, ${hm(W.redoMins)} extra. Good recovery.`);
  }
  const focus=skipped.length?`Next week's focus: <b style="display:inline;color:var(--text);font-size:inherit;letter-spacing:0;margin:0">${pgEsc(skipped[0][0])}</b>. Give it the freshest 20 minutes of the session.`:(done?"Nothing skipped. Next week's focus is quality: slower, cleaner, evener.":"Next week's focus: show up for the Warm-up. Everything else follows.");
  const dayRows=W.days.map(d=>{
    const keys=d.r.map((b,j)=>(j===SPOT?`<i class="gap"></i>`:"")+`<i class="${d.lit[j]?"on":""}" title="${pgEsc(b[0])}"></i>`).join("");
    const st=d.future?"upcoming":(d.done===d.total?"✓ "+d.done+"/"+d.total:d.done+"/"+d.total)+" · "+hm(d.mins);
    return `<div class="rp-day"><b>${d.name.slice(0,3).toUpperCase()}</b><div class="rp-keys" style="opacity:${d.future?.35:1}">${keys}</div><small>${st}</small>${(!d.future&&d.done&&d.done<d.total)?`<div class="rp-miss">Missed: ${d.missed.map(pgEsc).join(", ")}</div>`:""}${(!d.future&&!d.done&&!d.today)?`<div class="rp-miss">No practice logged.</div>`:""}</div>`}).join("");
  openModal("Weekly Report",`
  <div class="rp-tabs"><button class="mt-chip${offset===-1?" active":""}" data-rp="-1">Last week</button><button class="mt-chip${offset===0?" active":""}" data-rp="0">This week</button></div>
  <div class="rp-hero"><div class="rp-ring"><svg viewBox="0 0 104 104"><circle class="bg" cx="52" cy="52" r="45"/><circle class="fg" cx="52" cy="52" r="45" stroke-dasharray="${circ.toFixed(1)}" stroke-dashoffset="${(circ*(1-pct/100)).toFixed(1)}"/></svg><div class="pc">${pct}%</div></div>
  <div><h3>${g}</h3><p>${range}<br>${gl}</p></div></div>
  <div class="rp-stats"><div class="rp-stat"><b>${pdays}/${past.length}</b><span>DAYS</span></div><div class="rp-stat"><b>${done}/${sched}</b><span>BLOCKS</span></div><div class="rp-stat"><b>${hm(mins)}</b><span>PLAYED</span></div></div>
  <div class="rp-box" style="margin-top:0"><b>EVERY DAY</b>${dayRows}</div>
  <div class="rp-two"><div class="rp-box"><b>CORE · ${cp}%</b>${coreD} of ${coreS} blocks</div><div class="rp-box"><b>SPOTLIGHT · ${sp}%</b>${spD} of ${spS} blocks</div></div>
  <div class="rp-two"><div class="rp-box"><b>MOST SKIPPED</b>${skipped.length?`<ul>${skipped.map(([n,m])=>`<li>${pgEsc(n)} · missed ${m.s-m.d} of ${m.s}</li>`).join("")}</ul>`:"Nothing. Every block you scheduled got done."}</div><div class="rp-box"><b>ROCK SOLID</b>${solid.length?`<ul>${solid.map(([n,m])=>`<li>${pgEsc(n)} · ${m.d}/${m.s}</li>`).join("")}</ul>`:"Nothing repeated every time yet."}</div></div>
  ${notes.length?`<div class="rp-box"><b>COACH NOTES</b><ul>${notes.map(x=>`<li>${x}</li>`).join("")}</ul></div>`:""}
  <div class="rp-box"><b>NEXT WEEK</b>${focus}</div>
  <div class="rp-box"><b>SUNDAY RESET</b><ul><li>Pick one skipped or shaky thing and diagnose it slowly for ten minutes.</li><li>Play something purely for fun. No timer.</li><li>Rest your hands. Set one intention for Monday.</li></ul></div>`);
  document.querySelectorAll("[data-rp]").forEach(b=>b.onclick=()=>openReport(Number(b.dataset.rp)));
}

/* ---------- wire up the tool buttons ---------- */
["notesBtn","notesBtn2"].forEach(id=>{const b=$(id);if(b)b.onclick=()=>{ntQuery="";ntOpen()}});

<script id="redo-day-script">

function openRedoDayPicker(){

  const body=order.map(d=>`<button class="secondary redo-choice" data-day="${d}" style="margin:5px 0">${d}</button>`).join("");
  openModal("Redo a Day",`
    <div class="row"><b>Make-up session</b><span>Choose any training day to run again. This is extra practice on top of your normal day.</span></div>
    ${body}
  `);
  document.querySelectorAll(".redo-choice").forEach(b=>b.onclick=()=>{
    activeDay=b.dataset.day;
    routine=routines[activeDay];
    isRedo=true;
    idx=0;
    $("modal").classList.remove("open");
    $("modal").style.zIndex="";
    start();
  });
}
$("redoDay").onclick=openRedoDayPicker;

</script>
</body>
</html>
